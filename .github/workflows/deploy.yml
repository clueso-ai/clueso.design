name: Deploy

# main → https://clueso.design (AWS CluesoProduction, ap-south-1).
# Image: ECR clueso-design/web. Stack: clueso-design-prod (deploy/cloudformation.yml).
# One-time AWS setup lives in deploy/setup.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ACCOUNT: "131105490139"
  STACK: clueso-design-prod
  ECR_REPO: clueso-design/web
  IAM_ROLE: arn:aws:iam::131105490139:role/clueso-design-deploy
  CFN_ROLE: arn:aws:iam::131105490139:role/clueso-design-cfn
  HOSTED_ZONE_ID: Z0023495UUVT57VVFYU9
  VPC_ID: vpc-059e180bd2a349892
  PUBLIC_SUBNETS: subnet-07cf3fdca3bc17690,subnet-05152e5badf3e7d07,subnet-0a1928e25648c0a5a
  APP_SUBNETS: subnet-0253412c7a6fe4453,subnet-0173ef53f11c7a101,subnet-05b48498138c3a2e5
  ALB_CERT: arn:aws:acm:ap-south-1:131105490139:certificate/465c86a6-7ca5-44a1-bc71-6b23da659284
  CDN_CERT: arn:aws:acm:us-east-1:131105490139:certificate/23464888-7e3b-4993-8a89-7789a4c74f59

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # native arm64, matches the Fargate tasks
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push image
        id: image
        run: |
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          IMAGE="$REGISTRY/$ECR_REPO:${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --platform linux/arm64 --provenance=false --sbom=false -f deploy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file deploy/cloudformation.yml \
            --role-arn "$CFN_ROLE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUrl="${{ steps.image.outputs.image }}" \
              HostedZoneId="$HOSTED_ZONE_ID" \
              VpcId="$VPC_ID" \
              PublicSubnets="$PUBLIC_SUBNETS" \
              AppSubnets="$APP_SUBNETS" \
              AlbCertArn="$ALB_CERT" \
              CdnCertArn="$CDN_CERT" \
              HelloWebhookSecretArn="${{ vars.HELLO_WEBHOOK_SECRET_ARN }}" \
              UpstashRedisUrl="${{ secrets.UPSTASH_REDIS_REST_URL }}" \
              UpstashRedisToken="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"

      # After the rollout, so nothing an old task answered during it outlives the deploy.
      - name: Clear the CloudFront cache
        run: |
          DIST=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*' --query Invalidation.Id --output text

      - name: Check the live site
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://clueso.design/ || true)
            [ "$code" = "200" ] && { echo "clueso.design is up"; exit 0; }
            echo "attempt $i: $code"; sleep 15
          done
          echo "clueso.design did not return 200" >&2; exit 1
